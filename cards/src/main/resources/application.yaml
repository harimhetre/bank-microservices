server:
  port: 9092

spring:
  application:
    name: cards

  datasource:
    url: jdbc:h2:mem:cardsDB
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import:
      - "application_qa.yaml"
      - "application_prod.yaml"

  profiles:
    active:
      - "prod"


build:
  version: "1.0"

cards:
  message: "Welcome to bank cards related local APIs"
  contactDetails:
    name: Hari Mhetre
    email: hari.mhetre22@gmail.com
  onCallSupport:
    - (555) 555-1234
    - (444) 444-1234
