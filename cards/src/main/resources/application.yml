server:
  port: 9092

spring:
  application:
    name: cards
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:cardsDB
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:9093/"
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

  endpoint:
    shutdown:
      enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRepository: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://eurekaserver:9094/eureka/

info:
  app:
    name: "Cards"
    description: "This is my bank account microservice"
    version: "1.0.0"
