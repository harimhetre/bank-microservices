services:
  rabbit:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "hmhetre/configserver:v1"
    container_name: configserver-ms
    ports:
      - "9093:9093"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9093/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  loans:
    image: "hmhetre/loans:v3"
    container_name: loans-ms
    ports:
      - "9091:9091"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loans"
    extends:
      service: microservice-configserver-config
      file: common-config.yml

  accounts:
    image: "hmhetre/accounts:v3"
    container_name: accounts-ms
    ports:
      - "9090:9090"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    extends:
      service: microservice-configserver-config
      file: common-config.yml

  cards:
    image: "hmhetre/cards:v3"
    container_name: cards-ms
    ports:
      - "9092:9092"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      service: microservice-configserver-config
      file: common-config.yml

networks:
  my-bank:
    driver: "bridge"

