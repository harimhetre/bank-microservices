  configserver:
    image: "hmhetre/configserver:v5"
    container_name: configserver-ms
    ports:
      - "9093:9093"
    #    depends_on:
    #      rabbit:
    #        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9093/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver:
    image: "hmhetre/eurekaserver:v1"
    container_name: eurekaserver-ms
    ports:
      - "9094:9094"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
    healthcheck:
      test: "curl --fail --silent localhost:9094/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  loans:
    image: "hmhetre/loans:v7"
    container_name: loans-ms
    ports:
      - "9091:9091"
    depends_on:
    #      loansdb:
    #        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loans"
    #      SPRING_DATASOURCE_URL: "jdbc:mysql://localhost:3306/loansdb"
    extends:
      service: microservice-configserver-config
      file: common-config.yml

  accounts:
    image: "hmhetre/accounts:v7"
    container_name: accounts-ms
    ports:
      - "9090:9090"
    depends_on:
    #      accountsdb:
    #        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    #      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"
    extends:
      service: microservice-configserver-config
      file: common-config.yml

  cards:
    image: "hmhetre/cards:v7"
    container_name: cards-ms
    ports:
      - "9092:9092"
    depends_on:
    #      cardsdb:
    #        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "cards"
    #      SPRING_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/cardsdb"
    extends:
      service: microservice-configserver-config
      file: common-config.yml

networks:
  my-bank:
    driver: "bridge"

