spring:
  application:
    name: gatewayserver

  config:
    import: "optional:configserver:http://localhost:9093/"

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      enabled: true

  info:
    env:
      enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: "http://localhost:9094/eureka"

info:
  app:
    name: "GatewayServer"
    description: "This is my bank gateway server"
    version: "1.0.0"

logging:
  level:
    com:
      bank:
        gatewayserver: Debug

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000